<div id="streamlit-widget-root" style="position: fixed; bottom: 25px; right: 25px; z-index: 2147483647;">
  
  <!-- Chat Window -->
  <div id="streamlit-window" style="display: none; width: 350px; height: 500px; background: white; border-radius: 16px; box-shadow: 0 10px 50px rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 20px; border: 1px solid #e0e0e0;">
    <div style="background: #FF4B4B; color: white; padding: 14px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 600; font-family: sans-serif;">Doc Assistant</span>
      <button onclick="toggleStreamlitChat()" style="background: none; border: none; color: white; cursor: pointer; font-size: 24px; line-height: 1;">&times;</button>
    </div>
    <iframe
      src="https://streamlit.app"
      width="100%"
      height="445px"
      style="border: none;"
      allow="clipboard-read; clipboard-write"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
    ></iframe>
  </div>

  <!-- Launcher Button (Animated Heart with Curved Text) -->
  <button id="streamlit-launcher" onclick="toggleStreamlitChat()" class="bounce-animation" 
          style="background: white; border: none; width: 90px; height: 90px; border-radius: 50%; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; position: relative; padding: 0;">
    
    <!-- Curved Text SVG -->
    <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; position: absolute; transform: rotate(-10deg);">
      <path id="textPath" d="M 15,50 A 35,35 0 1,1 85,50" fill="transparent" />
      <text fill="#FF4B4B" style="font-family: sans-serif; font-size: 9.5px; font-weight: bold; letter-spacing: 1px;">
        <textPath xlink:href="#textPath" startOffset="50%" text-anchor="middle">
          CHAT WITH OUR DOCS
        </textPath>
      </text>
    </svg>

    <!-- Heart Icon -->
    <span style="font-size: 32px; margin-top: 10px;">❤️</span>
  </button>
</div>

<style>
  /* Bouncing Animation */
  .bounce-animation {
    animation: gentle-bounce 2s infinite ease-in-out;
  }

  @keyframes gentle-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Zoom on Hover */
  #streamlit-launcher:hover {
    animation-play-state: paused;
    transform: scale(1.1);
  }
</style>

<script>
  function toggleStreamlitChat() {
    var win = document.getElementById('streamlit-window');
    var btn = document.getElementById('streamlit-launcher');
    
    if (win.style.display === 'none' || win.style.display === '') {
      win.style.display = 'block';
      btn.style.display = 'none';
    } else {
      win.style.display = 'none';
      btn.style.display = 'flex';
    }
  }
</script>
