<div id="streamlit-widget-root" style="position: fixed; bottom: 25px; right: 25px; z-index: 2147483647;">
  
  <!-- Chat Window -->
  <div id="streamlit-window" style="display: none; width: 380px; height: 600px; background: white; border-radius: 16px; box-shadow: 0 10px 50px rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 20px; border: 1px solid #e0e0e0;">
    <div style="background: #FF4B4B; color: white; padding: 14px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 600; font-family: sans-serif;">Doc Assistant</span>
      <button onclick="toggleStreamlitChat()" style="background: none; border: none; color: white; cursor: pointer; font-size: 24px; line-height: 1;">&times;</button>
    </div>
    <iframe
      src="https://global-mcp-doc-context7.streamlit.app/?embed=true"
      width="100%"
      height="545px"
      style="border: none;"
      allow="clipboard-read; clipboard-write"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
    ></iframe>
  </div>

  <!-- Launcher Button (Bigger Circle with Wrapped Text) -->
  <button id="streamlit-launcher" onclick="toggleStreamlitChat()" class="widget-bounce" 
          style="background: white; border: none; width: 120px; height: 120px; border-radius: 50%; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; position: relative; padding: 0; outline: none;">
    
    <!-- Curved Text SVG -->
    <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; position: absolute; transform: rotate(-90deg);">
      <defs>
        <path id="circlePath" d="M 50,50 m -37,0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" />
      </defs>
      <text fill="#FF4B4B" style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">
        <textPath xlink:href="#circlePath" startOffset="25%" text-anchor="middle">
          • Chat with our docs •
        </textPath>
      </text>
    </svg>

    <!-- Heart Icon -->
    <span style="font-size: 40px; position: relative; z-index: 1;">❤️</span>
  </button>
</div>

<style>
  /* Gentle Bouncing Animation */
  .widget-bounce {
    animation: widget-float 3s infinite ease-in-out;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes widget-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  /* Interaction Effects */
  #streamlit-launcher:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }
  
  #streamlit-launcher:active {
    transform: scale(0.95);
  }
</style>

<script>
  function toggleStreamlitChat() {
    var win = document.getElementById('streamlit-window');
    var btn = document.getElementById('streamlit-launcher');
    
    if (win.style.display === 'none' || win.style.display === '') {
      win.style.display = 'block';
      btn.style.display = 'none';
    } else {
      win.style.display = 'none';
      btn.style.display = 'flex';
    }
  }
</script>
